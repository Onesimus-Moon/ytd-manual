<title>YTD Manual</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mute:#667085;--line:#e3e6eb;--accent:#1f3a5f;--accentfg:#fff;--warn:#fff3c4;--warnfg:#7a5b00;--ok:#e3f1e8;--okfg:#1f6b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--card:#18202b;--fg:#e8ecf2;--mute:#9aa6b6;--line:#2a3441;--accent:#8fb4e8;--accentfg:#10151d;--warn:#4a3d10;--warnfg:#f3d77a;--ok:#173325;--okfg:#8fd6a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151d;--card:#18202b;--fg:#e8ecf2;--mute:#9aa6b6;--line:#2a3441;--accent:#8fb4e8;--accentfg:#10151d;--warn:#4a3d10;--warnfg:#f3d77a;--ok:#173325;--okfg:#8fd6a8;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding-inline:16px;padding-block:16px 40px;line-height:1.4}
main{max-width:720px;margin:0 auto}
h1{font-size:1.35rem;margin:4px 0 2px}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;font:inherit;font-size:.82rem;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accentfg);border-color:var(--accent)}
h2{font-size:.8rem;letter-spacing:.04em;color:var(--mute);margin:18px 0 6px;text-transform:uppercase}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li a,li .nolink{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none;min-height:24px}
li a:active{background:var(--line)}
.no{flex:none;min-width:3.4em;color:var(--mute);font-size:.8rem;font-variant-numeric:tabular-nums}
.ti{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{flex:none;font-size:.68rem;padding:2px 7px;border-radius:999px}
.tag.review{background:var(--warn);color:var(--warnfg)}
.ext{flex:none;font-size:.68rem;color:var(--mute);text-transform:uppercase}
.nolink{opacity:.7}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.foot{color:var(--mute);font-size:.75rem;margin-top:24px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<main>
<h1>YTD Manual</h1>
<p class="sub">개정판(rev1) 기준 · 제목을 누르면 Drive에서 열립니다</p>
<div class="bar">

<div id="list"></div>

</main>

const SECS=[...new Set(D.map(x=>x.s))];
let sec='',onlyReview=false;
const chips=document.getElementById('chips'),list=document.getElementById('list'),q=document.getElementById('q');
function chip(label,on,fn){const b=document.createElement('button');b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',on);b.onclick=fn;return b}
function drawChips(){chips.innerHTML='';chips.append(chip('전체',!sec&&!onlyReview,()=>{sec='';onlyReview=false;render()}));
SECS.forEach(s=>chips.append(chip(s.replace(/^\d+\.\s*/,''),sec===s,()=>{sec=sec===s?'':s;render()})));
chips.append(chip('2024본만',onlyReview,()=>{onlyReview=!onlyReview;render()}))}
function render(){drawChips();const t=q.value.trim().toLowerCase();
const rows=D.filter(x=>(!sec||x.s===sec)&&(!onlyReview||x.st==='review')&&(!t||(x.t+' '+x.n+' '+x.s).toLowerCase().includes(t)));
list.innerHTML='';if(!rows.length){list.innerHTML='<p class="empty">찾는 문서가 없습니다.</p>';return}
let cur='',ul;rows.forEach(x=>{if(x.s!==cur){cur=x.s;const h=document.createElement('h2');h.textContent=cur;list.append(h);ul=document.createElement('ul');list.append(ul)}
const li=document.createElement('li');const el=document.createElement(x.u?'a':'div');if(x.u){el.href=x.u;el.target='_blank';el.rel='noopener'}else el.className='nolink';
const n=document.createElement('span');n.className='no';n.textContent=x.n==='별첨'?'':x.n;
const ti=document.createElement('span');ti.className='ti';ti.textContent=x.t+(x.u?'':' (링크 없음)');
el.append(n,ti);if(x.st==='review'){const g=document.createElement('span');g.className='tag review';g.textContent='2024본';el.append(g)}
const e=document.createElement('span');e.className='ext';e.textContent=x.e;el.append(e);li.append(el);ul.append(li)})}
q.addEventListener('input',render);render();
